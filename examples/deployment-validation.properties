# Alias spelling must match the names returned by KeyStore.aliases().
target.alias=server
requiredAliases=server

# Deny-by-default: only these observed alias/status combinations are permitted.
# A mandatory change must also be allowed. Metadata-only changes need their own permission.
allowChange.server=CHANGED,METADATA_CHANGED
requireChange.server=CHANGED

# Exact DNS SAN names, case/IDN normalized; no CN, wildcard or IP-address fallback.
renewal.requiredDnsNames=api.example.test
renewal.minimumRemainingDays=90
renewal.requireLaterExpiry=true
renewal.preserveSubject=true
renewal.requireEndEntity=true
# ANY, MUST_CHANGE, MUST_REMAIN (public key only; no private-key comparison).
renewal.publicKey=MUST_REMAIN
# Zero-based X.509 KeyUsage bits: 0=digitalSignature, 2=keyEncipherment.
renewal.requiredKeyUsage=0
# TLS server authentication; the EKU extension and this explicit OID must be present.
renewal.requiredEku=1.3.6.1.5.5.7.3.1

# These aliases must be TrustedCertificateEntry entries, not private-key entries.
trust.anchorAliases=root-ca
# DISABLED: visible non-gating NOT_CHECKED revocation finding.
# REQUIRED: required NOT_CHECKED finding blocks overall PASS; OCSP/CRL is not implemented.
trust.revocation=DISABLED
